<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>User List</title>
  </head>
  <body>
    <header class="mb-5">
    <div class="container mt-5 d-flex justify-content-end">
      <div class="theme-button btn-group">
        <button type="button" class="btn btn-secondary" data-bs-theme-value="dark">Dark</button>
        <button type="button" class="btn btn-light" data-bs-theme-value="light">Light</button>
      </div>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="row">

        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-body">
              <div class="d-flex gap-3">
                <img class="img-fluid rounded-circle" src="https://randomuser.me/api/portraits/men/75.jpg" alt="John Doe"/>
                <div>
                  <h5 class="card-title mb-1">John Doe</h5>
                  <p class="card-text mb-0">Troy, MI</p>
                  <div>
                    <span class="badge text-bg-primary">Nature</span>
                    <span class="badge text-bg-primary">Travel</span>
                    <span class="badge text-bg-primary">Sport</span>
                  </div>                     
                  <button type="button" class="btn btn-secondary" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="john@gmail.com">Show Email</button>
              </div>
            </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-body">
              <div class="d-flex gap-3">
                <img class="img-fluid rounded-circle" src="https://randomuser.me/api/portraits/women/75.jpg" alt="Lehla Nichols"/>
                <div>
                  <h5 class="card-title mb-1">Lehla Nichols</h5>
                  <p class="card-text mb-0">Fort Worth, TX</p>
                  <div>
                    <span class="badge text-bg-primary">Fashion</span>
                    <span class="badge text-bg-primary">STEM</span>
                    <span class="badge text-bg-primary">Architecture</span>
                  </div>                     
                  <button type="button" class="btn btn-secondary" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="lehla@gmail.com">Show Email</button>
              </div>
                </div>
              </div>  
              </div>
            </div>

          <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-body">
              <div class="d-flex gap-3">
                <img class="img-fluid rounded-circle" src="https://randomuser.me/api/portraits/women/44.jpg" alt="Annie Rice"/>
                <div>
                  <h5 class="card-title mb-1">Annie Rice</h5>
                  <p class="card-text mb-0">FTroy, MI</p>
                  <div>
                    <span class="badge text-bg-primary">Electronics</span>
                    <span class="badge text-bg-primary">Tech</span>
                    <span class="badge text-bg-primary">Music</span>
                  </div>                     
                  <button type="button" class="btn btn-secondary" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="annie@gmail.com">Show Email</button>
              </div>
                </div>
              </div>  
              </div>
            </div>
          </div>

          <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-body">
              <div class="d-flex gap-3">
                <img class="img-fluid rounded-circle" src="media/1me.jpeg" alt="Sunpitch Kanasiri"/>
                <div>
                  <h5 class="card-title mb-1">Sunpitch Kanasiri</h5>
                  <p class="card-text mb-0">Bangkok, Thailand</p>
                  <div>
                    <span class="badge text-bg-primary">Gaming</span>
                    <span class="badge text-bg-primary">Music</span>
                    <span class="badge text-bg-primary">Travel</span>
                  </div>                     
                  <button type="button" class="btn btn-secondary" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top" data-bs-content="sunpitch.kan@dome.tu.ac.th">Show Email</button>
              </div>
                </div>
              </div>  
              </div>
            </div>
          </div>
        </div>
      </div>
  </main>
  <h1 class="mb-4">User</h1>
  <div class="container">
    <div class="row">
      <div class="col-md-4">
        <input type="search" placeholder="Search Users">
      </div>
      <div class="col-md-8">
        <div class="user-menu d-flex justify-content-end align-items-center">
          <a href="#" class="me-3">Reputation</a>
          <a href="#" class="me-3 text-bg-primary rounded-3">New Users</a>
          <a href="#" class="me-3">Editors</a>
          <a href="#">Moderators</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/darkmodetoggle.js"></script>

</html>
